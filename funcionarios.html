<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Funcionários | Gestor de Férias</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <header class="topo">

        <div class="logo">
            GESTOR DE FÉRIAS
        </div>

        <div class="subtitulo">
            Gestão de férias e ausências
        </div>

    </header>


    <main class="conteudo">

        <div class="cabecalho-pagina">

            <a href="index.html">
                ← Voltar
            </a>

            <div>

                <span class="etiqueta">
                    GESTÃO
                </span>

                <h1>
                    Funcionários
                </h1>

                <p>
                    Consulte e gira os funcionários da empresa.
                </p>

            </div>

        </div>


        <section class="card">

            <h2>
                Lista de funcionários
            </h2>

            <button type="button">
                + Adicionar funcionário
            </button>

        </section>


        <section class="card">

            <h2>
                Novo funcionário
            </h2>

            <label>
                Nome completo
            </label>

            <input
                type="text"
                placeholder="Nome completo"
            >

            <br><br>

            <label>
                Função
            </label>

            <select>

                <option value="">
                    Selecionar função
                </option>

                <option value="instrutor">
                    Instrutor
                </option>

                <option value="administrativo">
                    Administrativo
                </option>

            </select>

            <br><br>

            <button type="button">
                Guardar funcionário
            </button>

        </section>

    </main>


    <footer>

        Gestor de Férias

    </footer>

</body>

</html>
